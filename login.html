<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#141b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyWealth">
<title>Masuk · MyWealth</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('mw_theme') || 'light');</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; padding:20px;">
  <div class="mw-card" style="width:100%; max-width:380px;">
    <div class="d-flex flex-column align-items-center text-center mb-3">
      <h1 style="font-size:20px;font-weight:700;margin:0;">MyWealth</h1>
      <div class="text-muted-mw" style="font-size:13px;">Portal Keuangan Keluarga</div>
    </div>

    <form id="loginForm" class="d-flex flex-column gap-3">
      <div>
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="loginEmail" required autocomplete="username">
      </div>
      <div>
        <label class="form-label">Kata Sandi</label>
        <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password">
      </div>
      <div class="text-danger d-none" id="loginError" style="font-size:13px;"></div>
      <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="border-radius:10px;">Masuk</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
