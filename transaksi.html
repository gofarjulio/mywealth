<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transaksi · MyWealth</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('mw_theme') || 'light');</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="transaksi">
<div class="app-shell">
  <aside class="sidebar d-none d-lg-block" id="sidebarDesktop"></aside>
  <div class="main-wrap">
    <header class="topnav" id="topnav"></header>
    <main class="main-content" id="pageContent">

      <div class="mw-card mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-6 col-md-2">
            <label class="form-label">Tipe</label>
            <select class="form-select form-select-sm" id="filterType">
              <option value="all">Semua</option>
              <option value="income">Pemasukan</option>
              <option value="expense">Pengeluaran</option>
              <option value="transfer">Transfer</option>
              <option value="adjustment">Penyesuaian</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">Kategori</label>
            <select class="form-select form-select-sm" id="filterCategory"><option value="">Semua</option></select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">Akun</label>
            <select class="form-select form-select-sm" id="filterAccount"><option value="">Semua</option></select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">Dari Tanggal</label>
            <input type="date" class="form-control form-control-sm" id="filterStart">
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">Sampai Tanggal</label>
            <input type="date" class="form-control form-control-sm" id="filterEnd">
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">Cari Catatan</label>
            <input type="text" class="form-control form-control-sm" id="filterSearch" placeholder="cth: bensin">
          </div>
        </div>
      </div>

      <div class="mw-card">
        <div class="mw-card-header">
          <div>
            <h3>Daftar Transaksi</h3>
            <div class="subtitle" id="txCountLabel">0 transaksi</div>
          </div>
          <button class="btn btn-sm btn-outline-secondary" id="clearFiltersBtn">Reset Filter</button>
        </div>
        <div class="table-responsive">
          <table class="mw-table">
            <thead><tr><th>Tanggal</th><th>Tipe</th><th>Kategori</th><th>Akun</th><th>Catatan</th><th class="text-end">Jumlah</th><th></th></tr></thead>
            <tbody id="txTableBody"></tbody>
          </table>
        </div>
        <div class="empty-state d-none" id="txEmpty"><i class="bi bi-inbox"></i>Tidak ada transaksi yang cocok dengan filter.</div>
      </div>

    </main>
  </div>
</div>
<div id="offcanvasHost"></div>
<div id="quickAddModalHost"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/format.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/transaksi.js"></script>
</body>
</html>
