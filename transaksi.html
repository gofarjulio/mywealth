<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#141b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyWealth">
<title>Transactions · MyWealth</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('mw_theme') || 'light');</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="transaksi">
<div class="app-shell">
  <aside class="sidebar d-none d-lg-block" id="sidebarDesktop"></aside>
  <div class="main-wrap">
    <header class="topnav" id="topnav"></header>
    <main class="main-content" id="pageContent">

      <div class="tx-period-nav">
        <button class="btn btn-sm btn-outline-secondary" id="periodPrevBtn"><i class="bi bi-chevron-left"></i></button>
        <div class="tx-period-label" id="periodLabel"></div>
        <button class="btn btn-sm btn-outline-secondary" id="periodNextBtn"><i class="bi bi-chevron-right"></i></button>
      </div>

      <div class="tx-tabs" id="txTabs">
        <button class="tx-tab active" data-tab="daily">Daily</button>
        <button class="tx-tab" data-tab="calendar">Calendar</button>
        <button class="tx-tab" data-tab="monthly">Monthly</button>
        <button class="tx-tab" data-tab="total">Total</button>
        <button class="tx-tab" data-tab="note">Note</button>
      </div>

      <div class="mw-card mb-3" id="filterPanel">
        <div class="row g-2 align-items-end">
          <div class="col-6 col-md-2">
            <label class="form-label">Type</label>
            <select class="form-select form-select-sm" id="filterType">
              <option value="all">All</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
              <option value="transfer">Transfer</option>
              <option value="adjustment">Adjustment</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">Category</label>
            <select class="form-select form-select-sm" id="filterCategory"><option value="">All</option></select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">Account</label>
            <select class="form-select form-select-sm" id="filterAccount"><option value="">All</option></select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">From Date</label>
            <input type="date" class="form-control form-control-sm" id="filterStart">
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">To Date</label>
            <input type="date" class="form-control form-control-sm" id="filterEnd">
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">Search Note</label>
            <input type="text" class="form-control form-control-sm" id="filterSearch" placeholder="e.g. gas">
          </div>
        </div>
      </div>

      <div class="tx-tabpane" id="tabDaily">
        <div class="mw-card mb-3">
          <div class="tx-summary-row">
            <div class="tx-summary-item"><div class="tx-summary-label">Income</div><div class="tx-summary-value up" id="dailyIncomeVal">Rp0</div></div>
            <div class="tx-summary-item"><div class="tx-summary-label">Expenses</div><div class="tx-summary-value down" id="dailyExpenseVal">Rp0</div></div>
            <div class="tx-summary-item"><div class="tx-summary-label">Total</div><div class="tx-summary-value" id="dailyTotalVal">Rp0</div></div>
          </div>
        </div>
        <div class="mw-card">
          <div class="mw-card-header">
            <div>
              <h3>Transaction List</h3>
              <div class="subtitle" id="txCountLabel">0 transactions</div>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-outline-secondary" id="exportExcelBtn"><i class="bi bi-file-earmark-excel me-1"></i>Export Excel</button>
              <button class="btn btn-sm btn-outline-secondary" id="clearFiltersBtn">Reset Filters</button>
            </div>
          </div>
          <div id="txList"></div>
          <div class="empty-state d-none" id="txEmpty"><i class="bi bi-inbox"></i>No transactions match the filters.</div>
        </div>
      </div>

      <div class="tx-tabpane d-none" id="tabCalendar">
        <div class="mw-card">
          <div id="calGrid" class="cal-grid"></div>
        </div>
        <div class="mw-card mt-3 d-none" id="calDayCard">
          <div class="mw-card-header"><h3 id="calDayTitle"></h3></div>
          <div id="calDayList"></div>
        </div>
      </div>

      <div class="tx-tabpane d-none" id="tabMonthly">
        <div class="mw-card">
          <div class="mw-card-header"><div><h3>Monthly Summary</h3></div></div>
          <div id="monthlyList"></div>
          <div class="empty-state d-none" id="monthlyEmpty"><i class="bi bi-inbox"></i>No transactions match the filters.</div>
        </div>
      </div>

      <div class="tx-tabpane d-none" id="tabTotal">
        <div class="row g-3">
          <div class="col-6 col-md-4">
            <div class="mw-card stat-tile">
              <div class="stat-top"><span class="stat-label">Total Income</span><span class="stat-icon icon-badge-income"><i class="bi bi-arrow-down-left"></i></span></div>
              <div class="stat-value" id="totIncomeVal">Rp0</div>
            </div>
          </div>
          <div class="col-6 col-md-4">
            <div class="mw-card stat-tile">
              <div class="stat-top"><span class="stat-label">Total Expenses</span><span class="stat-icon icon-badge-expense"><i class="bi bi-arrow-up-right"></i></span></div>
              <div class="stat-value" id="totExpenseVal">Rp0</div>
            </div>
          </div>
          <div class="col-6 col-md-4">
            <div class="mw-card stat-tile">
              <div class="stat-top"><span class="stat-label">Balance</span><span class="stat-icon icon-badge-balance"><i class="bi bi-wallet2"></i></span></div>
              <div class="stat-value" id="totBalanceVal">Rp0</div>
            </div>
          </div>
        </div>
        <div class="form-text mt-2">Follows the active filters above.</div>
      </div>

      <div class="tx-tabpane d-none" id="tabNote">
        <div class="mw-card mb-3">
          <div class="mw-card-header"><h3>Add Note</h3></div>
          <div class="d-flex gap-2 align-items-start">
            <textarea class="form-control" id="noteInput" rows="2" placeholder="Write a free-form note..."></textarea>
            <button class="btn btn-primary" id="noteAddBtn" style="border-radius:10px;">Save</button>
          </div>
        </div>
        <div class="mw-card">
          <div class="mw-card-header"><h3>All Notes</h3></div>
          <ul class="mw-legend" id="noteList"></ul>
          <div class="empty-state d-none" id="noteEmpty"><i class="bi bi-journal-text"></i>No notes yet.</div>
        </div>
      </div>

    </main>
  </div>
</div>
<div id="offcanvasHost"></div>
<div id="quickAddModalHost"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/format.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/transaksi.js"></script>
</body>
</html>
